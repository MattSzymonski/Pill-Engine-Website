name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "landing_page/**"
      - "docs/**"
      - "build-script.js"
      - "package.json"
      - .github/workflows/deploy.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install all dependencies
      - name: Install dependencies
        run: |
          npm install
          cd landing_page && npm install
          cd ../docs && npm install

      # 4. Build both sites (uses root build script)
      - name: Build landing page and docs
        run: npm run build

      # 5. Deploy landing page and docs to their domains via SSH.
      #    Requires secrets: SERVER_HOST, SERVER_USER, SERVER_KEY,
      #    LANDING_WEBROOT (server path for https://pill.rocks) and
      #    DOCS_WEBROOT (server path for https://docs.pill.rocks).
      - name: Deploy to Server
        run: |
          set -e

          echo "=== Landing output ==="
          ls -la dist/
          echo ""
          echo "=== Docs output ==="
          ls -la dist-docs/
          echo ""
          echo "=== Deploy targets ==="
          echo "Landing (pill.rocks):      ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.LANDING_WEBROOT }}"
          echo "Docs (docs.pill.rocks):    ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DOCS_WEBROOT }}"
          echo ""

          # Write SSH key
          echo "${{ secrets.SERVER_KEY }}" > deploy_key
          chmod 600 deploy_key

          SSH_TARGET="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          SSH_OPTS="-i deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.SERVER_PORT || 22 }}"

          # Deploy the landing page to pill.rocks
          echo "=== Deploying landing page to ${{ secrets.LANDING_WEBROOT }} ==="
          tar -czf - -C dist . | ssh $SSH_OPTS $SSH_TARGET \
            "mkdir -p ${{ secrets.LANDING_WEBROOT }} && tar -xzf - -C ${{ secrets.LANDING_WEBROOT }}"

          # Deploy the docs to docs.pill.rocks
          echo "=== Deploying docs to ${{ secrets.DOCS_WEBROOT }} ==="
          tar -czf - -C dist-docs . | ssh $SSH_OPTS $SSH_TARGET \
            "mkdir -p ${{ secrets.DOCS_WEBROOT }} && tar -xzf - -C ${{ secrets.DOCS_WEBROOT }}"

          echo ""
          echo "=== Deploy complete ==="

          rm -f deploy_key
