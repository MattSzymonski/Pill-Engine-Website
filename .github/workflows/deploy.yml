name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "landing_page/**"
      - "docs/**"
      - "build-script.js"
      - "package.json"
      - .github/workflows/deploy.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install all dependencies
      - name: Install dependencies
        run: |
          npm install
          cd landing_page && npm install
          cd ../docs && npm install

      # 4. Build both sites (uses root build script)
      - name: Build landing page and docs
        run: npm run build

      # 5. Deploy to server via SSH
      - name: Deploy to Server
        run: |
          set -e

          echo "=== Build output ==="
          ls -la dist/
          echo ""
          echo "=== File count ==="
          find dist -type f | wc -l
          echo ""
          echo "=== Deploy target ==="
          echo "Host: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo "Port: ${{ secrets.SERVER_PORT || 22 }}"
          echo ""

          # Write SSH key
          echo "${{ secrets.SERVER_KEY }}" > deploy_key
          chmod 600 deploy_key

          # Deploy via SSH with verbose logging
          tar -czf - -C dist . | \
            ssh -v -i deploy_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.SERVER_PORT || 22 }} \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 2>&1

          echo ""
          echo "=== Deploy complete ==="

          rm -f deploy_key
